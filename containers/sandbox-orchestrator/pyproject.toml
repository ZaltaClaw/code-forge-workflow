[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-orchestrator"
version = "0.1.0"
description = "Request-per-sandbox orchestrator for Code Forge, built on the agent-sandbox SDK."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "k8s-agent-sandbox>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sandbox-orchestrator = "sandbox_orchestrator.__main__:main"

[tool.setuptools.packages.find]
include = ["sandbox_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
