[project]
name = "code-forge-workflow"
version = "0.1.0"
description = "Multi-agent coding pipeline as a Microsoft Agent Framework graph workflow"
requires-python = ">=3.10"
dependencies = [
    "agent-framework>=0.0.0a1",
    "agent-framework-claude>=0.0.0a1",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_forge"]
