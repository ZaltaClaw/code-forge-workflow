# Production overlay — copy and customize per environment.
global:
  registry: codeforgedemo.azurecr.io
  azureTenantId: "61800350-09d8-4051-942c-5b732fcaa307"
  foundry:
    resource: admin-mgrojh0e-eastus2
    models:
      opus: gpt-5.4-mini
      sonnet: gpt-5-mini
      haiku: gpt-4o

sandboxOrchestrator:
  image:
    tag: 1.0.2
  # The "direct" backend now provisions via a SandboxClaim that adopts a
  # pre-warmed pod from the warm pool (sub-2s allocation) and drives it via pod
  # exec. We stay on exec rather than the SDK's HTTP transport because the
  # agent-pod image runs Claude Code, not the agent-sandbox runtime server.
  backend: direct
modelGateway:
  replicas: 1
  budgets:
    default:
      maxBudgetUsd: 50
      tpmLimit: 200000
      rpmLimit: 200

networkPolicies:
  enabled: true
