# =============================================================================
# Code Forge — production values
# Override via -f values-prod.yaml or --set key=value
# =============================================================================

global:
  # Azure Container Registry that hosts agent-pod, sandbox-orchestrator, model-gateway images.
  registry: acrtheclouds.azurecr.io
  # Azure tenant + workload identity client IDs (set per-environment).
  azureTenantId: "" # e.g. 72f988bf-86f1-41af-91ab-2d7cd011db47
  # Microsoft Foundry resource for Claude deployments.
  foundry:
    resource: "" # e.g. codeforge-foundry-westus3
    # If set, overrides resource-based URL construction.
    baseUrl: "" # https://{resource}.services.ai.azure.com/anthropic
    # Deployment names — must match Azure Foundry deployments (pin model versions!)
    models:
      opus: "claude-opus-4-8"
      sonnet: "claude-sonnet-4-6"
      haiku: "claude-haiku-4-5"

# -------------------------------------------------------------------------
# Namespaces & isolation
# -------------------------------------------------------------------------
namespaces:
  sessionControl: session-control
  platform: platform

# -------------------------------------------------------------------------
# Agent Pod image (Claude Code on Foundry)
# The agent-pod is no longer deployed as a standalone warm-pool Deployment —
# the Sandbox Orchestrator's SandboxTemplate / SandboxWarmPool runs this image
# instead (see sandboxOrchestrator below). Only the image coordinates are kept
# here because the SandboxTemplate references them.
# -------------------------------------------------------------------------
agentPod:
  image:
    repository: code-forge/agent-pod
    tag: 1.0.0
    pullPolicy: IfNotPresent

# -------------------------------------------------------------------------
# Sandbox Orchestrator
# Sandbox-native successor to the session-router. Receives a request and
# provisions ONE agent sandbox per request via the agent-sandbox SDK
# (create → run → teardown), instead of label-patching a warm pod.
# -------------------------------------------------------------------------
sandboxOrchestrator:
  image:
    repository: code-forge/sandbox-orchestrator
    tag: 1.0.0
    pullPolicy: IfNotPresent

  replicas: 2
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1000m", memory: "1Gi" }

  service:
    port: 8080

  # Backend: "direct" (create Sandbox CRs + pod exec; matches the minimal
  # agent-sandbox controller installed here), "sdk" (upstream claim/template/
  # warmpool client; needs those CRDs), or "fake" (in-memory; tests only).
  backend: direct
  # SDK connection architecture: in-cluster | local-tunnel | gateway | direct.
  connectionMode: in-cluster

  sandbox:
    # Namespace the Sandbox resources live in.
    namespace: agent-sandboxes
    # Container image each sandbox pod runs. Defaults to the agent-pod image so
    # Claude Code is present inside the sandbox. Leave empty to fall back to the
    # busybox smoke image baked into the orchestrator.
    image: ""
    # PodSecurity "restricted" forbids root; run as the sandbox image's own
    # non-root user. The default agent-pod image creates `agent` as UID 1001
    # (UID 1000 is the base image's `vscode`) and owns /workspace, so the
    # sandbox must run as 1001 to have a writable workspace. Keep this in sync
    # with the SANDBOX_IMAGE's workspace owner.
    runAsUser: 1001
    # Resource envelope stamped onto each sandbox container.
    resources:
      requests: { cpu: "250m", memory: "256Mi" }
      limits: { cpu: "1000m", memory: "1Gi" }
    # Container name inside each sandbox pod. The orchestrator execs into this
    # container, so it must match what the SandboxTemplate / direct manifest
    # stamps onto the pod.
    containerName: sandbox
    # Provision the SandboxTemplate + SandboxWarmPool from this chart. Requires
    # the agent-sandbox extensions CRDs (v0.4.6 extensions.yaml) on the cluster.
    # Set false on minimal clusters running only the "direct" backend.
    provisionTemplate: true
    # SandboxTemplate the warm pool (and "sdk" backend claims) are built from.
    # Provisioned by the chart from the agent-pod image below.
    templateName: python-sandbox-template
    # When true, the "direct" backend provisions by claiming a pre-warmed pod
    # from the warm pool (SandboxClaim adoption) instead of cold-creating a
    # bare Sandbox CR. Gives sub-2s session-style allocation.
    useWarmpool: true
    # Default warm pool a request claims from when it doesn't name one
    # (used by the "sdk" backend; ignored by "direct").
    warmpool: python-sandbox-warmpool
    # Number of pre-warmed sandboxes the controller keeps Ready in the pool.
    # This is what makes session allocation sub-2s instead of a cold start.
    warmpoolReplicas: 2
    # Opt into a headless Service per sandbox (v0.4.6 made this opt-in). The
    # orchestrator routes via pod exec, so leave off unless you need DNS.
    service: false
    # Size limit for the sandbox's writable /workspace emptyDir (Claude Code's
    # config dir + staged files live here under a read-only root filesystem).
    workspaceSize: 8Gi
    # How long to wait for a provisioned sandbox to report Ready.
    readyTimeout: 180
    # Controller-side TTL (SandboxClaim shutdownTime). Safety net if we crash.
    ttlSeconds: 3600
    # Per-command execution timeout inside the sandbox.
    commandTimeout: 300
    # API group of the core agent-sandbox CRD (kind Sandbox). MUST match the
    # cluster — used to scope the orchestrator's RBAC Role.
    apiGroup: agents.x-k8s.io
    # API group of the agent-sandbox *extensions* CRDs (SandboxClaim,
    # SandboxTemplate, SandboxWarmPool), installed from the v0.4.6
    # extensions.yaml. Needed by the "sdk" backend's claim/template/warmpool flow.
    extensionsApiGroup: extensions.agents.x-k8s.io

  # Admission caps — exceeding either returns HTTP 429 (carried from the router).
  concurrency:
    maxTotal: 100
    maxPerDev: 3

  # How a free-text task becomes a sandbox command. {task} is shell-quoted.
  agentCommandTemplate: "claude -p {task}"

# -------------------------------------------------------------------------
# Model Gateway (LiteLLM)
# Single proxy for all Foundry traffic. Per-dev rate limits, cost showback,
# audit trail, key rotation. Agent pods point ANTHROPIC_FOUNDRY_BASE_URL here.
# -------------------------------------------------------------------------
modelGateway:
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-stable
    pullPolicy: IfNotPresent

  replicas: 2
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2000m", memory: "4Gi" }

  service:
    port: 80
    targetPort: 4000

  # Per-tenant budget caps. Agents authenticate via virtual key
  # which the router mints from Cosmos at session start.
  budgets:
    default:
      maxBudgetUsd: 50
      tpmLimit: 200000
      rpmLimit: 200

  # Master key (rotated quarterly). Stored in Key Vault → CSI driver mount.
  masterKeySecretRef:
    name: model-gateway-master-key
    key: master-key

# -------------------------------------------------------------------------
# Workload identity — federated to Azure AD via OIDC issuer.
# -------------------------------------------------------------------------
workloadIdentity:
  enabled: true
  sandboxOrchestrator:
    serviceAccountName: sandbox-orchestrator
    clientId: ""
  modelGateway:
    serviceAccountName: model-gateway
    clientId: ""

# -------------------------------------------------------------------------
# NetworkPolicy — restrict-by-default egress.
# -------------------------------------------------------------------------
networkPolicies:
  enabled: true
