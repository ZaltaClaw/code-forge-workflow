---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-router
  namespace: {{ .Values.namespaces.sessionControl }}
  labels:
    app: session-router
    {{- include "code-forge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sessionRouter.replicas }}
  selector: { matchLabels: { app: session-router } }
  template:
    metadata:
      labels:
        app: session-router
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.workloadIdentity.sessionRouter.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: router
          image: {{ .Values.global.registry }}/{{ .Values.sessionRouter.image.repository }}:{{ .Values.sessionRouter.image.tag }}
          imagePullPolicy: {{ .Values.sessionRouter.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: REDIS_HOST
              value: "{{ .Values.sessionRouter.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.sessionRouter.redis.port }}"
            - name: COSMOS_ENDPOINT
              value: "{{ .Values.sessionRouter.cosmosdb.endpoint }}"
            - name: COSMOS_DATABASE
              value: "{{ .Values.sessionRouter.cosmosdb.database }}"
            - name: COSMOS_CONTAINER
              value: "{{ .Values.sessionRouter.cosmosdb.container }}"
            - name: AGENT_POOL_NAMESPACE
              value: "{{ .Values.namespaces.agentPool }}"
            - name: MODEL_GATEWAY_URL
              value: "http://model-gateway.{{ .Values.namespaces.platform }}.svc.cluster.local"
          resources:
            {{- toYaml .Values.sessionRouter.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: session-router
  namespace: {{ .Values.namespaces.sessionControl }}
spec:
  selector: { app: session-router }
  ports:
    - port: {{ .Values.sessionRouter.service.port }}
      targetPort: 8080
      name: http
{{- if and .Values.sessionRouter.keda.enabled .Values.sessionRouter.keda.httpAddon.enabled }}
---
# KEDA HTTP Add-on — RPS-based scaling for the router.
# Buffers requests during cold-start; scales-to-zero off-hours.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: session-router
  namespace: {{ .Values.namespaces.sessionControl }}
spec:
  hosts:
    {{- range .Values.sessionRouter.keda.httpAddon.hosts }}
    - {{ . | quote }}
    {{- end }}
  pathPrefixes:
    {{- range .Values.sessionRouter.keda.httpAddon.pathPrefixes }}
    - {{ . | quote }}
    {{- end }}
  scaleTargetRef:
    name: session-router
    kind: Deployment
    apiVersion: apps/v1
    service: session-router
    port: {{ .Values.sessionRouter.service.port }}
  replicas:
    min: {{ .Values.sessionRouter.replicas }}
    max: 50
  scaledownPeriod: {{ .Values.sessionRouter.keda.httpAddon.scaledownPeriod }}
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: {{ .Values.sessionRouter.keda.httpAddon.targetPendingRequests }}
      window: 1m
{{- end }}
---
# Session router needs RBAC to label/patch agent pods (warm → bound → cooldown).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-router-pod-binder
  namespace: {{ .Values.namespaces.agentPool }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-router-pod-binder
  namespace: {{ .Values.namespaces.agentPool }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.workloadIdentity.sessionRouter.serviceAccountName }}
    namespace: {{ .Values.namespaces.sessionControl }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-router-pod-binder
