{{- if .Values.workloadIdentity.enabled }}
{{- range $key, $cfg := dict "agentPod" .Values.workloadIdentity.agentPod "sessionRouter" .Values.workloadIdentity.sessionRouter "modelGateway" .Values.workloadIdentity.modelGateway }}
{{- $ns := ternary $.Values.namespaces.agentPool (ternary $.Values.namespaces.sessionControl $.Values.namespaces.platform (eq $key "sessionRouter")) (eq $key "agentPod") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cfg.serviceAccountName }}
  namespace: {{ $ns }}
  annotations:
    azure.workload.identity/client-id: "{{ $cfg.clientId }}"
    azure.workload.identity/tenant-id: "{{ $.Values.global.azureTenantId }}"
  labels:
    azure.workload.identity/use: "true"
    {{- include "code-forge.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
