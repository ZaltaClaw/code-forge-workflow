{{- if .Values.workloadIdentity.enabled }}
{{- range $key, $cfg := dict "modelGateway" .Values.workloadIdentity.modelGateway }}
{{- $ns := $.Values.namespaces.platform }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cfg.serviceAccountName }}
  namespace: {{ $ns }}
  annotations:
    azure.workload.identity/client-id: "{{ $cfg.clientId }}"
    azure.workload.identity/tenant-id: "{{ $.Values.global.azureTenantId }}"
  labels:
    azure.workload.identity/use: "true"
    {{- include "code-forge.labels" $ | nindent 4 }}
{{- end }}
{{- end }}
