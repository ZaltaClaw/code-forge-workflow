---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pool-quota
  namespace: {{ .Values.namespaces.agentPool }}
spec:
  hard:
    pods: "500"
    requests.cpu: "500"
    requests.memory: 1000Gi
    persistentvolumeclaims: "100"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-pod
  namespace: {{ .Values.namespaces.agentPool }}
  labels:
    app: agent-pod
    {{- include "code-forge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentPod.replicas }}
  selector:
    matchLabels:
      app: agent-pod
  template:
    metadata:
      labels:
        app: agent-pod
        state: warm
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.workloadIdentity.agentPod.serviceAccountName }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      nodeSelector:
        {{- toYaml .Values.agentPod.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.agentPod.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.agentPod.egressFirewall.enabled }}
      initContainers:
        - name: egress-firewall
          image: {{ .Values.global.registry }}/code-forge/egress-firewall:1.0.0
          securityContext:
            capabilities: { add: ["NET_ADMIN"] }
            runAsUser: 0
          env:
            - name: ALLOW_LIST
              value: "{{ join "," .Values.agentPod.egressFirewall.allowList }}"
      {{- end }}
      containers:
        - name: agent
          image: {{ .Values.global.registry }}/{{ .Values.agentPod.image.repository }}:{{ .Values.agentPod.image.tag }}
          imagePullPolicy: {{ .Values.agentPod.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            {{- include "code-forge.claudeCodeFoundryEnv" . | nindent 12 }}
            - name: SESSION_ID
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['session-id']" } }
            - name: DEV_ID
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['dev-id']" } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: "metadata.name" } }
            - name: IDLE_TIMEOUT_SECONDS
              value: "{{ .Values.agentPod.idleTimeoutSeconds }}"
            # Claude Code config dir — overridden so we can mount the persistent volume here.
            - name: CLAUDE_CONFIG_DIR
              value: /workspace/.claude
          resources:
            {{- toYaml .Values.agentPod.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/agent/.cache
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 30
          # Pre-stop hook flushes session state + scrubs workspace so spot eviction is safe.
          lifecycle:
            preStop:
              exec:
                command: ["/usr/local/bin/agent-shutdown"]
      volumes:
        - name: workspace
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: {{ .Values.agentPod.workspace.storageClass }}
                resources: { requests: { storage: "{{ .Values.agentPod.workspace.size }}" } }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
        - name: cache
          emptyDir: { sizeLimit: 4Gi }
{{- if .Values.agentPod.keda.enabled }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-pod
  namespace: {{ .Values.namespaces.agentPool }}
spec:
  scaleTargetRef:
    name: agent-pod
  pollingInterval: {{ .Values.agentPod.keda.pollingIntervalSeconds }}
  cooldownPeriod: {{ .Values.agentPod.keda.cooldownPeriodSeconds }}
  minReplicaCount: {{ .Values.agentPod.keda.minReplicas }}
  maxReplicaCount: {{ .Values.agentPod.keda.maxReplicas }}
  triggers:
    - type: azure-servicebus
      metadata:
        namespace: {{ .Values.agentPod.keda.serviceBus.namespace | quote }}
        queueName: {{ .Values.agentPod.keda.serviceBus.queue | quote }}
        messageCount: {{ .Values.agentPod.keda.serviceBus.messageCount | quote }}
      authenticationRef:
        name: keda-azure-identity
{{- end }}
