{{- if .Values.networkPolicies.enabled }}
---
# Model gateway can reach Azure Foundry (egress) on 443; ingress from cluster only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-gateway-egress
  namespace: {{ .Values.namespaces.platform }}
spec:
  podSelector:
    matchLabels: { app: model-gateway }
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Foundry + Azure AD STS. Restrict by FQDN at the firewall/private-endpoint layer.
    - ports:
        - { protocol: TCP, port: 443 }
---
# Agent sandboxes get the same default-deny egress posture as the agent pool:
# they may reach cluster DNS and the model gateway only — no direct Foundry,
# no public internet, no lateral movement. Ingress is left unrestricted because
# the orchestrator drives sandboxes via the kube-apiserver exec stream (which
# NetworkPolicy does not govern), not pod-to-pod traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-sandbox-egress
  namespace: {{ .Values.sandboxOrchestrator.sandbox.namespace }}
spec:
  podSelector:
    matchLabels: { app: agent-sandbox }
  policyTypes: ["Egress"]
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Model gateway only.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespaces.platform }} }
          podSelector:
            matchLabels: { app: model-gateway }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 4000 }
{{- end }}
