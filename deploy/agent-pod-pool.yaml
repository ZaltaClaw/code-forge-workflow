# =============================================================================
# Warm Agent Pod Pool — stateless, scaled by KEDA on Service Bus depth.
# Pods start in state=warm; router patches state=bound when claimed.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: agent-pool
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: pool-quota, namespace: agent-pool }
spec:
  hard:
    pods: "200"
    requests.cpu: "200"
    requests.memory: 400Gi
    persistentvolumeclaims: "50"   # mounted on demand, not persistent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-pod
  namespace: agent-pool
  labels: { app: agent-pod }
spec:
  replicas: 80                    # baseline warm pool — KEDA overrides
  selector: { matchLabels: { app: agent-pod } }
  template:
    metadata:
      labels:
        app: agent-pod
        state: warm                # router flips to "bound" on allocation
    spec:
      serviceAccountName: agent-pod
      nodeSelector: { agentpool: spotagents }
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: agent
          image: acrtheclouds.azurecr.io/code-forge/agent:1.0.0
          env:
            - name: CLAUDE_CODE_USE_FOUNDRY
              value: "1"
            - name: ANTHROPIC_FOUNDRY_BASE_URL
              value: "http://model-gateway.platform.svc.cluster.local"   # via gateway, not direct
            - name: SESSION_ID
              valueFrom: { fieldRef: { fieldPath: metadata.labels['session-id'] } }
            - name: DEV_ID
              valueFrom: { fieldRef: { fieldPath: metadata.labels['dev-id'] } }
          resources:
            requests: { cpu: 1,   memory: 2Gi }
            limits:   { cpu: 4,   memory: 8Gi }
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: secrets
              mountPath: /secrets
              readOnly: true
          # Idle reaper signal: router patches annotation, pod self-exits cleanly
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh","-c","/app/scrub-workspace.sh"]
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace-placeholder    # rebound by router on claim
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: per-dev-secrets
---
# KEDA: scale pool on pending-session queue depth
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-pod-scaler
  namespace: agent-pool
spec:
  scaleTargetRef: { name: agent-pod }
  minReplicaCount: 40              # always warm headroom
  maxReplicaCount: 400
  pollingInterval: 10
  cooldownPeriod:  120
  triggers:
    - type: azure-servicebus
      metadata:
        queueName: pending-sessions
        messageCount: "5"          # 1 extra pod per 5 queued sessions
      authenticationRef: { name: sb-auth }
---
# NetworkPolicy: a session pod can ONLY reach the model gateway,
# its own dev's KV secrets (via CSI), and blob via private endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: agent-pod-egress, namespace: agent-pool }
spec:
  podSelector: { matchLabels: { app: agent-pod } }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { name: platform } }
          podSelector: { matchLabels: { app: model-gateway } }
      ports: [{ port: 80 }]
    - to:
        - ipBlock: { cidr: 10.10.0.0/16 }   # private endpoint subnet (KV + blob)
      ports: [{ port: 443 }]
    - to: []
      ports: [{ port: 53, protocol: UDP }]   # DNS
