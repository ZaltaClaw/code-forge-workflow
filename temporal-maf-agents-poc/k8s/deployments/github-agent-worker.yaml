# GitHub agent worker — `github-agent-tq`. Replica count is owned by KEDA
# (see k8s/keda/github-agent-scaledobject.yaml); it scales 0..10 from the
# task-queue backlog. Do not set `replicas` here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-agent-worker
  namespace: agent-platform
  labels:
    app: github-agent-worker
    task-queue: github-agent-tq
spec:
  selector:
    matchLabels:
      app: github-agent-worker
  template:
    metadata:
      labels:
        app: github-agent-worker
        task-queue: github-agent-tq
    spec:
      containers:
        - name: worker
          # TODO: replace with your registry image.
          image: temporal-maf-agents-poc:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: temporal-config
            - secretRef:
                name: live-agents-secret
          env:
            - name: WORKER_MODULE
              value: github_agent_worker.worker
            - name: AGENT_MODE
              value: live
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
