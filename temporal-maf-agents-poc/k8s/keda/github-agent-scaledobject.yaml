# KEDA ScaledObject for the GitHub agent worker.
# Scales the Deployment from the `github-agent-tq` Temporal task-queue backlog.
#
# Requires KEDA >= 2.17 (the Temporal scaler shipped in 2.17). Docs:
#   https://keda.sh/docs/2.19/scalers/temporal/
#
# Behaviour:
#   * minReplicaCount 0  -> scale to zero when the queue is idle (cost saving)
#   * targetQueueSize 5  -> KEDA adds replicas to keep backlog/replica ~5
#   * activationTargetQueueSize 0 -> any backlog (>0) wakes a worker from zero
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: github-agent-scaledobject
  namespace: agent-platform
spec:
  scaleTargetRef:
    name: github-agent-worker
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: temporal
      metadata:
        # Temporal frontend gRPC endpoint (host:port). Match temporal-config.
        endpoint: temporal-frontend.temporal.svc.cluster.local:7233
        namespace: agent-platform
        taskQueue: github-agent-tq
        targetQueueSize: "5"
        activationTargetQueueSize: "0"
      # TODO (Temporal Cloud): add API-key / mTLS auth via a TriggerAuthentication:
      # authenticationRef:
      #   name: temporal-cloud-auth
